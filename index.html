    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #020202; color: #fff; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .studio-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.92)), 
                        url('https://images.unsplash.com/photo-1536240478700-b869070f9279?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; background-position: center; z-index: -1;
        }
        .glass { background: rgba(15, 15, 15, 0.85); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 28px; transition: 0.4s; overflow: hidden; }
        .hero-text { font-family: 'Syncopate', sans-serif; text-transform: uppercase; letter-spacing: -1px; }
        .glow-hover:hover { border-color: #3b82f6; box-shadow: 0 0 40px rgba(59, 130, 246, 0.25); transform: translateY(-5px); }
        
        .video-container { position: relative; width: 100%; padding-bottom: 177.77%; height: 0; background: #000; border-radius: 20px; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .software-box { background: #0c0c0c; border: 1px solid #222; border-radius: 20px; transition: 0.3s; }
        .software-box:hover { border-color: #3b82f6; background: #111; }
        .skill-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 12px 0; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #ccc; }
        .skill-item i { color: #3b82f6; font-size: 10px; }

        /* አዲስ፡ ትኩረት የሚስብ አኒሜሽን ለ Upwork በተን */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(20, 168, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(20, 168, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(20, 168, 0, 0); }
        }
        .floating-hire {
            position: fixed; bottom: 30px; right: 30px; z-index: 1000;
            background: #14a800; color: white; padding: 15px 25px;
            border-radius: 50px; font-weight: 900; font-size: 14px;
            display: flex; align-items: center; gap: 10px; text-transform: uppercase;
            animation: pulse-green 2s infinite;
        }
    </style>
</head>
